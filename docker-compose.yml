x-app-runtime: &app-runtime
  image: ${SCHEDULER_IMAGE:-scheduler-app:local}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777

x-database-environment: &database-environment
  DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
  DATABASE_HOST: ${DATABASE_CONTAINER_HOST:-postgres}
  DATABASE_PORT: ${DATABASE_CONTAINER_PORT:-5432}
  DATABASE_NAME: ${DATABASE_NAME:-scheduler}
  DATABASE_SSLMODE: ${DATABASE_CONTAINER_SSLMODE:-disable}
  PGSSLROOTCERT: ${PGSSLROOTCERT:-}
  PGSSLCERT: ${PGSSLCERT:-}
  PGSSLKEY: ${PGSSLKEY:-}
  DATABASE_MAX_OPEN_CONNECTIONS: ${DATABASE_MAX_OPEN_CONNECTIONS:-15}
  DATABASE_MAX_IDLE_CONNECTIONS: ${DATABASE_MAX_IDLE_CONNECTIONS:-5}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_STATEMENT_TIMEOUT_SECONDS: ${DATABASE_STATEMENT_TIMEOUT_SECONDS:-30}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app-image:
    <<: *app-runtime
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-local}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: scheduler-app-image
    restart: "no"
    command: ["/bin/true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *default-logging

  postgres:
    image: postgres:16
    container_name: scheduler-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:-scheduler}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  postgres-bootstrap:
    image: postgres:16
    container_name: scheduler-postgres-bootstrap
    restart: "no"
    environment:
      <<: *database-environment
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      DATABASE_MIGRATOR_USER: ${DATABASE_MIGRATOR_USER:-scheduler_migrator}
      DATABASE_MIGRATOR_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:?DATABASE_MIGRATOR_PASSWORD is required}
      DATABASE_BOT_USER: ${DATABASE_BOT_USER:-scheduler_bot}
      DATABASE_BOT_PASSWORD: ${DATABASE_BOT_PASSWORD:?DATABASE_BOT_PASSWORD is required}
      DATABASE_PARSER_USER: ${DATABASE_PARSER_USER:-scheduler_parser}
      DATABASE_PARSER_PASSWORD: ${DATABASE_PARSER_PASSWORD:?DATABASE_PARSER_PASSWORD is required}
      DATABASE_PRIVACY_USER: ${DATABASE_PRIVACY_USER:-scheduler_privacy}
      DATABASE_PRIVACY_PASSWORD: ${DATABASE_PRIVACY_PASSWORD:?DATABASE_PRIVACY_PASSWORD is required}
      DATABASE_ADMIN_USER: ${DATABASE_ADMIN_USER:-scheduler_admin}
      DATABASE_ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?DATABASE_ADMIN_PASSWORD is required}
      DATABASE_SITE_USER: ${DATABASE_SITE_USER:-scheduler_site}
      DATABASE_SITE_PASSWORD: ${DATABASE_SITE_PASSWORD:?DATABASE_SITE_PASSWORD is required}
      DATABASE_BACKUP_USER: ${DATABASE_BACKUP_USER:-scheduler_backup}
      DATABASE_BACKUP_PASSWORD: ${DATABASE_BACKUP_PASSWORD:?DATABASE_BACKUP_PASSWORD is required}
      DATABASE_RESTORE_USER: ${DATABASE_RESTORE_USER:-scheduler_restore}
      DATABASE_RESTORE_PASSWORD: ${DATABASE_RESTORE_PASSWORD:?DATABASE_RESTORE_PASSWORD is required}
    volumes:
      - ./docker/postgres-bootstrap/bootstrap.sh:/usr/local/bin/scheduler-postgres-bootstrap:ro
    command: ["/bin/sh", "/usr/local/bin/scheduler-postgres-bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  migrator:
    <<: *app-runtime
    container_name: scheduler-migrator
    restart: "no"
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_MIGRATOR_USER:-scheduler_migrator}
      DATABASE_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:?DATABASE_MIGRATOR_PASSWORD is required}
      DATABASE_APPLY_RUNTIME_GRANTS: "true"
      DATABASE_BOT_USER: ${DATABASE_BOT_USER:-scheduler_bot}
      DATABASE_ADMIN_USER: ${DATABASE_ADMIN_USER:-scheduler_admin}
      DATABASE_PARSER_USER: ${DATABASE_PARSER_USER:-scheduler_parser}
      DATABASE_PRIVACY_USER: ${DATABASE_PRIVACY_USER:-scheduler_privacy}
    command: ["/app/scheduler-migrate"]
    depends_on:
      app-image:
        condition: service_completed_successfully
      postgres-bootstrap:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    logging: *default-logging

  bot:
    <<: *app-runtime
    container_name: scheduler-bot
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_BOT_USER:-scheduler_bot}
      DATABASE_PASSWORD: ${DATABASE_BOT_PASSWORD:?DATABASE_BOT_PASSWORD is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      BOT_USERNAME: ${BOT_USERNAME:-schedule_free_bot}
      BOT_TELEGRAM_API_URL: ${BOT_TELEGRAM_API_URL:-}
      BOT_TELEGRAM_API_ALLOW_INSECURE: ${BOT_TELEGRAM_API_ALLOW_INSECURE:-false}
      BOT_HEALTH_PORT: 8082
      BOT_MAX_CONCURRENT_HANDLERS: ${BOT_MAX_CONCURRENT_HANDLERS:-32}
      BOT_MAX_PENDING_PER_SENDER: ${BOT_MAX_PENDING_PER_SENDER:-8}
      BOT_STATE_TTL_MINUTES: ${BOT_STATE_TTL_MINUTES:-30}
      BOT_NOTIFICATION_BATCH_SIZE: ${BOT_NOTIFICATION_BATCH_SIZE:-250}
      BOT_NOTIFICATION_MAX_BATCHES: ${BOT_NOTIFICATION_MAX_BATCHES:-4}
      BOT_NOTIFICATION_POLL_SECONDS: ${BOT_NOTIFICATION_POLL_SECONDS:-1}
      PROJECT_URL: ${PROJECT_URL:-https://github.com/J0es1ick/Scheduler}
      BOT_PUBLIC_URL: ${BOT_PUBLIC_URL:-https://t.me/schedule_free_bot}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
    command: ["/app/scheduler-bot"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    stop_grace_period: 45s
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8082/ready >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: *default-logging

  parser-worker:
    <<: *app-runtime
    container_name: scheduler-parser-worker
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_PARSER_USER:-scheduler_parser}
      DATABASE_PASSWORD: ${DATABASE_PARSER_PASSWORD:?DATABASE_PARSER_PASSWORD is required}
      WORKER_HEALTH_PORT: 8083
    command: ["/app/scheduler-parser-worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    stop_grace_period: 45s
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8083/ready >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: *default-logging

  privacy-worker:
    <<: *app-runtime
    container_name: scheduler-privacy-worker
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_PRIVACY_USER:-scheduler_privacy}
      DATABASE_PASSWORD: ${DATABASE_PRIVACY_PASSWORD:?DATABASE_PRIVACY_PASSWORD is required}
      WORKER_HEALTH_PORT: 8084
    command: ["/app/scheduler-privacy-worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    stop_grace_period: 45s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8084/ready >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: *default-logging

  sync:
    <<: *app-runtime
    profiles: ["tools"]
    container_name: scheduler-sync
    restart: "no"
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_PARSER_USER:-scheduler_parser}
      DATABASE_PASSWORD: ${DATABASE_PARSER_PASSWORD:?DATABASE_PARSER_PASSWORD is required}
    entrypoint: ["/app/scheduler-sync"]
    command: []
    depends_on:
      migrator:
        condition: service_completed_successfully
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    logging: *default-logging

  admin:
    <<: *app-runtime
    container_name: scheduler-admin
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_ADMIN_USER:-scheduler_admin}
      DATABASE_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?DATABASE_ADMIN_PASSWORD is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      ADMIN_METRICS_TOKEN: ${ADMIN_METRICS_TOKEN:?ADMIN_METRICS_TOKEN is required}
      ADMIN_ACCESS_TOKEN: ${ADMIN_ACCESS_TOKEN:-}
      ADMIN_ACCESS_LOGIN_ENABLED: ${ADMIN_ACCESS_LOGIN_ENABLED:-false}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      ADMIN_PORT: 8080
    command: ["/app/scheduler-admin"]
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HOST_PORT:-18080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/api/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 45s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging: *default-logging

  site:
    <<: *app-runtime
    container_name: scheduler-site
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_SITE_USER:-scheduler_site}
      DATABASE_PASSWORD: ${DATABASE_SITE_PASSWORD:?DATABASE_SITE_PASSWORD is required}
      SITE_PORT: 8080
      PROJECT_URL: ${PROJECT_URL:-https://github.com/J0es1ick/Scheduler}
      BOT_PUBLIC_URL: ${BOT_PUBLIC_URL:-https://t.me/schedule_free_bot}
    command: ["/app/scheduler-site"]
    ports:
      - "${SITE_BIND_ADDRESS:-127.0.0.1}:${SITE_HOST_PORT:-18081}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/api/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 45s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  backup:
    build:
      context: .
      dockerfile: docker/postgres-backup/Dockerfile
    image: ${SCHEDULER_BACKUP_IMAGE:-scheduler-postgres-backup:local}
    container_name: scheduler-backup
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_BACKUP_USER:-scheduler_backup}
      DATABASE_PASSWORD: ${DATABASE_BACKUP_PASSWORD:?DATABASE_BACKUP_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-90000}
      BACKUP_OFFSITE_MAX_AGE_SECONDS: ${BACKUP_OFFSITE_MAX_AGE_SECONDS:-90000}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OFFSITE_RETENTION_MODE: ${BACKUP_OFFSITE_RETENTION_MODE:-filesystem}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-90}
      BACKUP_OFFSITE_MIN_GENERATIONS: ${BACKUP_OFFSITE_MIN_GENERATIONS:-7}
      BACKUP_OFFSITE_MAX_BYTES: ${BACKUP_OFFSITE_MAX_BYTES:-0}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_OFFSITE_DIRECTORY: ${BACKUP_OFFSITE_DIRECTORY:-}
      BACKUP_OFFSITE_SENTINEL_FILE: ${BACKUP_OFFSITE_SENTINEL_FILE:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_REQUIRE_OFFSITE: ${BACKUP_REQUIRE_OFFSITE:-false}
      MIGRATIONS_PATH: /app/migrations
    volumes:
      - pgbackups:/backups
      - pgrestorestaging:/restore-staging
      - ./migration:/app/migrations:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/scheduler-backup-health"]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging: *default-logging

  telegram-mock:
    image: python:3.13-alpine
    profiles: ["ci"]
    command: ["python", "/mock/telegram_api.py"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4m,mode=1777
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - ./docker/telegram-mock:/mock:ro
    logging: *default-logging

volumes:
  pgdata:
  pgbackups:
  pgrestorestaging:
