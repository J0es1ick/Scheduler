x-app-image: &app-image
  build:
    context: .
    args:
      VERSION: ${APP_VERSION:-dev}
      COMMIT: ${APP_COMMIT:-local}
      BUILD_TIME: ${APP_BUILD_TIME:-unknown}
  image: scheduler-app:local
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777

x-database-environment: &database-environment
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: ${DATABASE_NAME:-scheduler}
  DATABASE_SSLMODE: disable
  DATABASE_MAX_OPEN_CONNECTIONS: ${DATABASE_MAX_OPEN_CONNECTIONS:-15}
  DATABASE_MAX_IDLE_CONNECTIONS: ${DATABASE_MAX_IDLE_CONNECTIONS:-5}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
  DATABASE_STATEMENT_TIMEOUT_SECONDS: ${DATABASE_STATEMENT_TIMEOUT_SECONDS:-30}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    container_name: scheduler-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:-scheduler}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  postgres-bootstrap:
    image: postgres:16
    container_name: scheduler-postgres-bootstrap
    restart: "no"
    environment:
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      DATABASE_NAME: ${DATABASE_NAME:-scheduler}
      DATABASE_MIGRATOR_USER: ${DATABASE_MIGRATOR_USER:-scheduler_migrator}
      DATABASE_MIGRATOR_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:?DATABASE_MIGRATOR_PASSWORD is required}
      DATABASE_BOT_USER: ${DATABASE_BOT_USER:-scheduler_bot}
      DATABASE_BOT_PASSWORD: ${DATABASE_BOT_PASSWORD:?DATABASE_BOT_PASSWORD is required}
      DATABASE_ADMIN_USER: ${DATABASE_ADMIN_USER:-scheduler_admin}
      DATABASE_ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?DATABASE_ADMIN_PASSWORD is required}
      DATABASE_SITE_USER: ${DATABASE_SITE_USER:-scheduler_site}
      DATABASE_SITE_PASSWORD: ${DATABASE_SITE_PASSWORD:?DATABASE_SITE_PASSWORD is required}
      DATABASE_BACKUP_USER: ${DATABASE_BACKUP_USER:-scheduler_backup}
      DATABASE_BACKUP_PASSWORD: ${DATABASE_BACKUP_PASSWORD:?DATABASE_BACKUP_PASSWORD is required}
      DATABASE_RESTORE_USER: ${DATABASE_RESTORE_USER:-scheduler_restore}
      DATABASE_RESTORE_PASSWORD: ${DATABASE_RESTORE_PASSWORD:?DATABASE_RESTORE_PASSWORD is required}
    volumes:
      - ./docker/postgres-bootstrap/bootstrap.sh:/usr/local/bin/scheduler-postgres-bootstrap:ro
    command: ["/bin/sh", "/usr/local/bin/scheduler-postgres-bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  migrator:
    <<: *app-image
    container_name: scheduler-migrator
    restart: "no"
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_MIGRATOR_USER:-scheduler_migrator}
      DATABASE_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:?DATABASE_MIGRATOR_PASSWORD is required}
    command: ["/app/scheduler-migrate"]
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    logging: *default-logging

  bot:
    <<: *app-image
    container_name: scheduler-bot
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_BOT_USER:-scheduler_bot}
      DATABASE_PASSWORD: ${DATABASE_BOT_PASSWORD:?DATABASE_BOT_PASSWORD is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      BOT_USERNAME: ${BOT_USERNAME:-schedule_free_bot}
      BOT_TELEGRAM_API_URL: ${BOT_TELEGRAM_API_URL:-}
      BOT_HEALTH_PORT: 8082
      BOT_MAX_CONCURRENT_HANDLERS: ${BOT_MAX_CONCURRENT_HANDLERS:-32}
      BOT_MAX_PENDING_PER_SENDER: ${BOT_MAX_PENDING_PER_SENDER:-8}
      BOT_STATE_TTL_MINUTES: ${BOT_STATE_TTL_MINUTES:-30}
      PROJECT_URL: ${PROJECT_URL:-https://github.com/J0es1ick/Scheduler}
      BOT_PUBLIC_URL: ${BOT_PUBLIC_URL:-https://t.me/schedule_free_bot}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
    command: ["/app/scheduler-bot"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: *default-logging

  admin:
    <<: *app-image
    container_name: scheduler-admin
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_ADMIN_USER:-scheduler_admin}
      DATABASE_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?DATABASE_ADMIN_PASSWORD is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      ADMIN_METRICS_TOKEN: ${ADMIN_METRICS_TOKEN:?ADMIN_METRICS_TOKEN is required}
      ADMIN_ACCESS_TOKEN: ${ADMIN_ACCESS_TOKEN:-}
      ADMIN_ACCESS_LOGIN_ENABLED: ${ADMIN_ACCESS_LOGIN_ENABLED:-false}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      ADMIN_PORT: 8080
    command: ["/app/scheduler-admin"]
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HOST_PORT:-18080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 45s
    logging: *default-logging

  site:
    <<: *app-image
    container_name: scheduler-site
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_SITE_USER:-scheduler_site}
      DATABASE_PASSWORD: ${DATABASE_SITE_PASSWORD:?DATABASE_SITE_PASSWORD is required}
      SITE_PORT: 8080
      PROJECT_URL: ${PROJECT_URL:-https://github.com/J0es1ick/Scheduler}
      BOT_PUBLIC_URL: ${BOT_PUBLIC_URL:-https://t.me/schedule_free_bot}
    command: ["/app/scheduler-site"]
    ports:
      - "${SITE_BIND_ADDRESS:-127.0.0.1}:${SITE_HOST_PORT:-18081}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 45s
    logging: *default-logging

  backup:
    build: ./docker/postgres-backup
    image: scheduler-postgres-backup:local
    container_name: scheduler-backup
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      <<: *database-environment
      DATABASE_USER: ${DATABASE_BACKUP_USER:-scheduler_backup}
      DATABASE_PASSWORD: ${DATABASE_BACKUP_PASSWORD:?DATABASE_BACKUP_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-90000}
      BACKUP_OFFSITE_MAX_AGE_SECONDS: ${BACKUP_OFFSITE_MAX_AGE_SECONDS:-90000}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_OFFSITE_DIRECTORY: ${BACKUP_OFFSITE_DIRECTORY:-}
      BACKUP_ENCRYPTION_PASSPHRASE_FILE: ${BACKUP_ENCRYPTION_PASSPHRASE_FILE:-}
      MIGRATIONS_PATH: /app/migrations
    volumes:
      - pgbackups:/backups
      - ./migration:/app/migrations:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/scheduler-backup-health"]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging: *default-logging

  telegram-mock:
    image: python:3.13-alpine
    profiles: ["ci"]
    command: ["python", "/mock/telegram_api.py"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4m,mode=1777
    volumes:
      - ./docker/telegram-mock:/mock:ro
    logging: *default-logging

volumes:
  pgdata:
  pgbackups:
