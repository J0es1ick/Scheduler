global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: scheduler
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/admin-metrics-token
    static_configs:
      - targets: [admin:8080]
  - job_name: scheduler-host
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: scheduler-readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: [http://admin:8080/api/ready]
        labels:
          component: admin
      - targets: [http://site:8080/api/ready]
        labels:
          component: site
      - targets: [http://bot:8082/ready]
        labels:
          component: bot
      - targets: [http://parser-worker:8083/ready]
        labels:
          component: parser-worker
      - targets: [http://privacy-worker:8084/ready]
        labels:
          component: privacy-worker
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
