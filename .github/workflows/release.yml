name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: 123456:release-smoke-not-a-real-token
      DATABASE_NAME: scheduler
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: release-superuser-password
      DATABASE_MIGRATOR_PASSWORD: release-migrator-password
      DATABASE_BOT_PASSWORD: release-bot-database-password
      DATABASE_PARSER_PASSWORD: release-parser-database-password
      DATABASE_PRIVACY_PASSWORD: release-privacy-database-password
      DATABASE_ADMIN_PASSWORD: release-admin-database-password
      DATABASE_SITE_PASSWORD: release-site-database-password
      DATABASE_BACKUP_PASSWORD: release-backup-database-password
      DATABASE_RESTORE_PASSWORD: release-restore-database-password
      ADMIN_METRICS_TOKEN: release-metrics-token-with-at-least-32-characters
      BOT_TELEGRAM_API_URL: http://telegram-mock:8080
      BOT_TELEGRAM_API_ALLOW_INSECURE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require successful CI and CodeQL runs for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            ci_success=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.total_count')
            codeql_success=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.total_count')
            if [ "$ci_success" -gt 0 ] && [ "$codeql_success" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Successful CI and CodeQL runs do not both exist for ${GITHUB_SHA}; refusing to publish a release image."
          exit 1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: candidate-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/scheduler
          tags: type=raw,value=candidate-${{ github.sha }}
          flavor: latest=false
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: release-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/scheduler
          tags: type=ref,event=tag
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: backup-candidate-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/scheduler-backup
          tags: type=raw,value=candidate-${{ github.sha }}
          flavor: latest=false
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: backup-release-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/scheduler-backup
          tags: type=ref,event=tag
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.candidate-meta.outputs.tags }}
          labels: ${{ steps.release-meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: backup-build
        with:
          context: .
          file: docker/postgres-backup/Dockerfile
          push: true
          tags: ${{ steps.backup-candidate-meta.outputs.tags }}
          labels: ${{ steps.backup-release-meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
      - name: Smoke-test the exact candidate images
        id: smoke
        env:
          SCHEDULER_IMAGE: ${{ steps.candidate-meta.outputs.tags }}@${{ steps.build.outputs.digest }}
          SCHEDULER_BACKUP_IMAGE: ${{ steps.backup-candidate-meta.outputs.tags }}@${{ steps.backup-build.outputs.digest }}
        run: |
          cp .env.example .env
          docker pull "$SCHEDULER_BACKUP_IMAGE"
          docker image inspect "$SCHEDULER_BACKUP_IMAGE" >/dev/null
          docker compose --profile ci up -d --no-build telegram-mock postgres
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U "$POSTGRES_SUPERUSER" -d "$DATABASE_NAME" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose --profile ci ps
              exit 1
            fi
            sleep 2
          done
          docker compose run --rm --no-deps --pull never \
            --entrypoint /usr/local/bin/scheduler-postgres-bootstrap \
            -e POSTGRES_SUPERUSER -e POSTGRES_SUPERUSER_PASSWORD \
            -e DATABASE_MIGRATOR_PASSWORD -e DATABASE_BOT_PASSWORD \
            -e DATABASE_PARSER_PASSWORD -e DATABASE_PRIVACY_PASSWORD \
            -e DATABASE_ADMIN_PASSWORD -e DATABASE_SITE_PASSWORD \
            -e DATABASE_BACKUP_PASSWORD -e DATABASE_RESTORE_PASSWORD \
            backup
          docker compose --profile ci up -d --no-build admin site
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:18081/api/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose --profile ci ps
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T postgres psql -U postgres -d scheduler \
            -c "UPDATE data_sources SET is_enabled=FALSE"
          docker compose --profile ci up -d --no-build bot parser-worker privacy-worker
          bot_ready=false
          for attempt in $(seq 1 60); do
            if docker compose exec -T bot wget -q -O - http://127.0.0.1:8082/ready >/dev/null \
              && docker compose exec -T parser-worker wget -q -O - http://127.0.0.1:8083/ready >/dev/null \
              && docker compose exec -T privacy-worker wget -q -O - http://127.0.0.1:8084/ready >/dev/null; then
              bot_ready=true
              break
            fi
            sleep 2
          done
          if [ "$bot_ready" != true ]; then
            docker compose --profile ci ps
            exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/scheduler-backup-tests "$SCHEDULER_BACKUP_IMAGE"
          docker run --rm --entrypoint test "$SCHEDULER_BACKUP_IMAGE" -r /app/migrations/001_init.up.sql
      - name: Compose diagnostics
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          SCHEDULER_IMAGE: ${{ steps.candidate-meta.outputs.tags }}@${{ steps.build.outputs.digest }}
          SCHEDULER_BACKUP_IMAGE: ${{ steps.backup-candidate-meta.outputs.tags }}@${{ steps.backup-build.outputs.digest }}
        run: docker compose --profile ci logs --no-color --tail=200
      - name: Stop candidate smoke stack
        if: always() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure')
        env:
          SCHEDULER_IMAGE: ${{ steps.candidate-meta.outputs.tags }}@${{ steps.build.outputs.digest }}
          SCHEDULER_BACKUP_IMAGE: ${{ steps.backup-candidate-meta.outputs.tags }}@${{ steps.backup-build.outputs.digest }}
        run: docker compose --profile ci down -v --remove-orphans
      - name: Promote the tested digests to the release tags
        id: promote
        env:
          APP_CANDIDATE_IMAGE: ${{ steps.candidate-meta.outputs.tags }}
          APP_RELEASE_TAGS: ${{ steps.release-meta.outputs.tags }}
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          BACKUP_CANDIDATE_IMAGE: ${{ steps.backup-candidate-meta.outputs.tags }}
          BACKUP_RELEASE_TAGS: ${{ steps.backup-release-meta.outputs.tags }}
          BACKUP_DIGEST: ${{ steps.backup-build.outputs.digest }}
        shell: bash
        run: |
          promote() {
            candidate="$1"
            release_tags="$2"
            digest="$3"
            output_name="$4"
            image="${candidate%:*}"
            tags=()
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then
                tags+=(--tag "$tag")
              fi
            done <<< "$release_tags"
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "No release tags were generated for $image."
              exit 1
            fi
            docker buildx imagetools create "${tags[@]}" "$image@$digest"
            echo "$output_name=$image" >> "$GITHUB_OUTPUT"
          }
          promote "$BACKUP_CANDIDATE_IMAGE" "$BACKUP_RELEASE_TAGS" "$BACKUP_DIGEST" backup_image
          promote "$APP_CANDIDATE_IMAGE" "$APP_RELEASE_TAGS" "$APP_DIGEST" app_image
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.promote.outputs.app_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.promote.outputs.backup_image }}
          subject-digest: ${{ steps.backup-build.outputs.digest }}
          push-to-registry: true
