name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject committed environment files
        shell: bash
        run: |
          if git log --all --format= --name-only -- .env | grep -Fxq .env; then
            echo "A .env file exists in Git history. Rotate its secrets and purge it from every branch and tag."
            exit 1
          fi

  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go module metadata
        run: go mod tidy -diff
      - name: Test local secret rotation
        shell: pwsh
        run: ./scripts/rotate-local-secrets.tests.ps1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/admin/package-lock.json
            web/site/package-lock.json
      - name: Build embedded web assets
        run: |
          npm ci --prefix web/admin
          npm run build --prefix web/admin
          npm ci --prefix web/site
          npm run build --prefix web/site
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test -race ./cmd/... ./connector/... ./integrations/... ./internal/... ./migration/... ./parser/...
      - run: go vet ./cmd/... ./connector/... ./integrations/... ./internal/... ./migration/... ./parser/...
      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./cmd/... ./connector/... ./integrations/... ./internal/... ./parser/...

  web:
    name: Web ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, site]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate

  connector-python:
    name: Python Connector SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install ./sdk/python
      - run: python -m unittest discover -s sdk/python/tests -v
      - run: python -m compileall -q sdk/python/scheduler_connector

  admin-e2e:
    name: Admin E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/admin/package-lock.json
            web/site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose-smoke:
    name: Migrations, Compose and restore smoke
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: 123456:ci-only-not-a-real-token
      DATABASE_NAME: scheduler
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser-password-long
      DATABASE_MIGRATOR_PASSWORD: ci-migrator-password-long
      DATABASE_BOT_PASSWORD: ci-bot-database-password
      DATABASE_PARSER_PASSWORD: ci-parser-database-password
      DATABASE_PRIVACY_PASSWORD: ci-privacy-database-password
      DATABASE_ADMIN_PASSWORD: ci-admin-database-password
      DATABASE_SITE_PASSWORD: ci-site-database-password
      DATABASE_BACKUP_PASSWORD: ci-backup-database-password
      DATABASE_RESTORE_PASSWORD: ci-restore-database-password
      ADMIN_METRICS_TOKEN: ci-metrics-token-with-at-least-32-characters
      BOT_TELEGRAM_API_URL: http://telegram-mock:8080
      BOT_TELEGRAM_API_ALLOW_INSECURE: "true"
      BACKUP_OFFSITE_RETENTION_MODE: filesystem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/admin/package-lock.json
            web/site/package-lock.json
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Validate production Compose and monitoring
        env:
          PRODUCTION_DATABASE_HOST: db.example.test
          PRODUCTION_DB_CA_FILE: /tmp/scheduler-ca.pem
          PRODUCTION_OFFSITE_PATH: /tmp/scheduler-offsite
          SITE_PUBLIC_URL: https://scheduler.example.test
          BACKUP_AGE_RECIPIENT: age1ci-configuration-only
          SCHEDULER_IMAGE: scheduler-app:local
          SCHEDULER_BACKUP_IMAGE: scheduler-postgres-backup:local
          MONITORING_METRICS_TOKEN_FILE: /tmp/scheduler-metrics-token
          MONITORING_WEBHOOK_URL_FILE: /tmp/scheduler-webhook-url
        run: |
          docker compose --profile tools -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.monitoring.yml config --format json > /tmp/scheduler-production-compose.json
          jq -e '.services["postgres-bootstrap"].image == "scheduler-postgres-backup:local"' /tmp/scheduler-production-compose.json
          jq -e '[.services["postgres-bootstrap"].volumes[]? | select(.source | endswith("/docker/postgres-bootstrap/bootstrap.sh"))] | length == 0' /tmp/scheduler-production-compose.json
          jq -e '[.services.backup.volumes[]? | select(.source | endswith("/migration"))] | length == 0' /tmp/scheduler-production-compose.json
          jq -e '[.services.backup.volumes[]? | select(.target == "/offsite" and .type == "bind" and .bind.create_host_path != true)] | length == 1' /tmp/scheduler-production-compose.json
          jq -e '.services["backup-preflight"].image == "scheduler-postgres-backup:local"' /tmp/scheduler-production-compose.json
          jq -e '[.services["backup-preflight"].volumes[]? | select(.target == "/offsite" and .type == "bind" and .read_only != true and .bind.create_host_path != true)] | length == 1' /tmp/scheduler-production-compose.json
          jq -e '[.services.preflight.volumes[]? | select(.target == "/offsite")] | length == 0' /tmp/scheduler-production-compose.json
          jq -e '.services["parser-worker"].environment.DATABASE_USER == "scheduler_parser" and (.services["parser-worker"].environment | has("BOT_TOKEN") | not)' /tmp/scheduler-production-compose.json
          jq -e '.services["privacy-worker"].environment.DATABASE_USER == "scheduler_privacy" and (.services["privacy-worker"].environment | has("BOT_TOKEN") | not)' /tmp/scheduler-production-compose.json
          jq -e '.services.sync.environment.DATABASE_USER == "scheduler_parser" and (.services.sync.environment | has("BOT_TOKEN") | not)' /tmp/scheduler-production-compose.json
          docker run --rm --entrypoint promtool -v "$PWD/docker/monitoring:/config:ro" prom/prometheus:v3.5.0 check rules /config/alerts.yml
          docker run --rm --entrypoint amtool -v "$PWD/docker/monitoring:/config:ro" prom/alertmanager:v0.28.1 check-config /config/alertmanager.yml
      - name: Run the one-shot migrator and start HTTP services
        run: docker compose --profile ci up -d --build telegram-mock postgres admin site
      - name: Wait for reconciled services
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:18081/api/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ci ps
          exit 1
      - name: Start runtime workers with deterministic empty parser workload
        run: |
          docker compose exec -T postgres psql -U postgres -d scheduler \
            -c "UPDATE data_sources SET is_enabled=FALSE"
          docker compose --profile ci up -d bot parser-worker privacy-worker
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:18081/api/ready >/dev/null \
              && docker compose exec -T bot wget -q -O - http://127.0.0.1:8082/ready >/dev/null \
              && docker compose exec -T parser-worker wget -q -O - http://127.0.0.1:8083/ready >/dev/null \
              && docker compose exec -T privacy-worker wget -q -O - http://127.0.0.1:8084/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ci ps
          exit 1
      - name: Verify every embedded migration was applied
        run: |
          expected=$(find migration -name '*.up.sql' | wc -l | tr -d ' ')
          actual=$(docker compose exec -T postgres psql -U postgres -d scheduler -tAc 'SELECT COUNT(*) FROM schema_migrations')
          test "$actual" = "$expected"
      - name: Build embedded web assets
        run: |
          npm ci --prefix web/admin
          npm run build --prefix web/admin
          npm ci --prefix web/site
          npm run build --prefix web/site
      - name: Run PostgreSQL integration tests in isolated databases
        env:
          TEST_SITE_DATABASE_URL: postgres://scheduler_site:ci-site-database-password@127.0.0.1:55432/scheduler?sslmode=disable
        shell: bash
        run: |
          set -euo pipefail
          test_database=""
          cleanup_test_database() {
            if [ -n "$test_database" ]; then
              docker compose exec -T postgres dropdb -U postgres --if-exists "$test_database"
            fi
          }
          trap cleanup_test_database EXIT
          for package in database repository admin connectorapi; do
            test_database="scheduler_ci_${package}"
            docker compose exec -T postgres createdb -U postgres "$test_database"
            export TEST_DATABASE_URL="postgres://postgres:ci-superuser-password-long@127.0.0.1:55432/${test_database}?sslmode=disable"
            go test -race -p 1 -tags=integration "./internal/${package}" -count=1
            cleanup_test_database
            test_database=""
          done
          unset TEST_DATABASE_URL
          go test -race -tags=integration ./internal/site -count=1
      - name: Create and restore-verify a backup larger than the restore tmpfs
        run: |
          docker compose stop bot parser-worker privacy-worker admin site
          docker compose exec -T -e PGPASSWORD=ci-migrator-password-long postgres \
            psql -h 127.0.0.1 -U scheduler_migrator -d scheduler -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE dr_payload (id bigint PRIMARY KEY, payload bytea NOT NULL);
          INSERT INTO dr_payload
          SELECT g, decode(string_agg(md5((g::bigint * 100 + n)::text), '' ORDER BY n), 'hex')
          FROM generate_series(1, 100000) AS g
          CROSS JOIN generate_series(1, 16) AS n
          GROUP BY g;
          CREATE FUNCTION dr_future_migration_probe() RETURNS integer LANGUAGE sql AS 'SELECT 1';
          SQL
          printf '%s\n' 'CREATE TABLE dr_pending_migration_probe (id bigint PRIMARY KEY);' \
            > migration/999_ci_pending_migration.up.sql
          docker compose build app-image backup
          docker compose up -d --no-deps backup
          docker compose run --rm --no-deps --entrypoint /usr/local/bin/scheduler-backup-tests backup
          for attempt in $(seq 1 30); do
            if docker compose exec -T backup /usr/local/bin/scheduler-backup-health; then
              docker compose exec -T backup /bin/sh -ec '. /usr/local/lib/scheduler-backup-generation-lib.sh; dump=$(select_newest_valid_backup /backups "scheduler-*.dump"); test -n "$dump"; size=$(stat -c %s "$dump"); echo "restore test dump size: $size bytes"; test "$size" -gt 16777216'
              docker compose exec -T \
                -e DATABASE_USER=scheduler_restore \
                -e DATABASE_PASSWORD=ci-restore-database-password \
                -e BACKUP_VERIFY_RECEIPT_FILE=/backups/ci-verified-backup.receipt \
                backup /usr/local/bin/scheduler-verify-backup
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Restore an authenticated encrypted offsite copy
        shell: bash
        run: |
          key_dir="$RUNNER_TEMP/scheduler-backup-keys"
          offsite_dir="$RUNNER_TEMP/scheduler-backup-offsite"
          mkdir -p "$key_dir" "$offsite_dir"
          printf '%s\n' scheduler-offsite > "$offsite_dir/.scheduler-offsite"
          backup_uid=$(docker compose run --rm --no-deps --entrypoint id backup -u)
          backup_gid=$(docker compose run --rm --no-deps --entrypoint id backup -g)
          sudo chown "$backup_uid:$backup_gid" "$key_dir" "$offsite_dir"
          sudo chmod 700 "$key_dir" "$offsite_dir"
          recipient=$(docker compose run --rm --no-deps --entrypoint /bin/sh \
            -v "$key_dir:/keys" backup -ec \
            'umask 077; age-keygen --output /keys/identity; age-keygen -y /keys/identity')
          docker compose run --rm --no-deps --entrypoint /bin/sh \
            -v "$offsite_dir:/offsite" \
            -e BACKUP_REQUIRE_OFFSITE=true \
            -e BACKUP_OFFSITE_DIRECTORY=/offsite \
            -e BACKUP_AGE_RECIPIENT="$recipient" \
            backup -ec \
            'export PGPASSWORD="$DATABASE_PASSWORD" PGSSLMODE="$DATABASE_SSLMODE"; . /usr/local/lib/scheduler-backup-lib.sh; validate_offsite; create_local_backup; upload_offsite_backup "$last_local_backup"'
          docker compose run --rm --no-deps --entrypoint /usr/local/bin/scheduler-verify-backup \
            -v "$key_dir:/keys:ro" -v "$offsite_dir:/offsite:ro" \
            -e DATABASE_USER=scheduler_restore \
            -e DATABASE_PASSWORD=ci-restore-database-password \
            -e BACKUP_VERIFY_OFFSITE=true \
            -e BACKUP_OFFSITE_DIRECTORY=/offsite \
            -e BACKUP_AGE_IDENTITY_FILE=/keys/identity \
            backup
      - name: Exercise full disaster recovery and the next migration
        shell: bash
        run: |
          set -euo pipefail
          dr_database=scheduler_dr_verify
          cleanup_dr() {
            docker compose exec -T postgres dropdb -U postgres --if-exists --force "$dr_database" >/dev/null 2>&1 || true
            docker compose exec -T postgres psql -U postgres -d postgres \
              -c 'DROP ROLE IF EXISTS ci_external_admin_member, ci_forbidden_member, ci_privileged_parent, ci_forbidden_createdb, ci_forbidden_superuser' >/dev/null 2>&1 || true
          }
          trap cleanup_dr EXIT
          run_embedded_bootstrap() {
            docker compose run --rm --no-deps \
              --entrypoint /usr/local/bin/scheduler-postgres-bootstrap \
              -e POSTGRES_SUPERUSER -e POSTGRES_SUPERUSER_PASSWORD \
              -e DATABASE_MIGRATOR_PASSWORD -e DATABASE_BOT_PASSWORD \
              -e DATABASE_PARSER_PASSWORD -e DATABASE_PRIVACY_PASSWORD \
              -e DATABASE_ADMIN_PASSWORD -e DATABASE_SITE_PASSWORD \
              -e DATABASE_BACKUP_PASSWORD -e DATABASE_RESTORE_PASSWORD \
              "$@" backup
          }
          if run_embedded_bootstrap \
            -e POSTGRES_SUPERUSER=scheduler_bot \
            -e POSTGRES_SUPERUSER_PASSWORD=ci-bot-database-password \
            -e DATABASE_NAME=scheduler; then
            echo "Bootstrap accepted a runtime role as the configured superuser."
            exit 1
          fi
          docker compose exec -T postgres psql -U postgres -d postgres \
            -c "CREATE ROLE ci_forbidden_superuser SUPERUSER LOGIN PASSWORD 'ci-forbidden-superuser-password'"
          if run_embedded_bootstrap \
            -e DATABASE_BOT_USER=ci_forbidden_superuser \
            -e DATABASE_NAME=scheduler; then
            echo "Bootstrap accepted an existing superuser as a runtime role."
            exit 1
          fi
          docker compose exec -T postgres psql -U postgres -d postgres \
            -c "CREATE ROLE ci_forbidden_createdb CREATEDB LOGIN"
          if run_embedded_bootstrap \
            -e DATABASE_BACKUP_USER=ci_forbidden_createdb \
            -e DATABASE_NAME=scheduler; then
            echo "Bootstrap accepted an existing CREATEDB runtime role."
            exit 1
          fi
          createdb_preserved=$(docker compose exec -T postgres psql -U postgres -d postgres -tAc \
            "SELECT rolcreatedb FROM pg_roles WHERE rolname='ci_forbidden_createdb'")
          test "$createdb_preserved" = t
          docker compose exec -T postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ci_privileged_parent NOLOGIN" \
            -c "CREATE ROLE ci_forbidden_member LOGIN" \
            -c "GRANT ci_privileged_parent TO ci_forbidden_member"
          if run_embedded_bootstrap \
            -e DATABASE_ADMIN_USER=ci_forbidden_member \
            -e DATABASE_NAME=scheduler; then
            echo "Bootstrap accepted a runtime role with unexpected memberships."
            exit 1
          fi
          docker compose exec -T postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ci_external_admin_member LOGIN" \
            -c "GRANT scheduler_admin TO ci_external_admin_member"
          if run_embedded_bootstrap -e DATABASE_NAME=scheduler; then
            echo "Bootstrap accepted an unexpected member of an application role."
            exit 1
          fi
          docker compose exec -T postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "REVOKE scheduler_admin FROM ci_external_admin_member"
          docker compose exec -T \
            -e DATABASE_USER=scheduler_restore \
            -e DATABASE_PASSWORD=ci-restore-database-password \
            -e RESTORE_TARGET_DATABASE="$dr_database" \
            -e BACKUP_RESTORE_OFFSITE=false \
            -e BACKUP_RESTORE_RECEIPT_FILE=/backups/ci-verified-backup.receipt \
            backup /usr/local/bin/scheduler-restore-backup
          run_embedded_bootstrap -e DATABASE_NAME="$dr_database"
          docker compose run --rm --no-deps -e DATABASE_NAME="$dr_database" migrator
          pending_migration_check=$(docker compose exec -T postgres psql -U postgres -d "$dr_database" -tAc "
            SELECT EXISTS (
              SELECT 1 FROM schema_migrations WHERE name='999_ci_pending_migration.up.sql'
            ) AND EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_schema='public' AND table_name='dr_pending_migration_probe'
            )")
          test "$pending_migration_check" = t
          owner_check=$(docker compose exec -T postgres psql -U postgres -d "$dr_database" -tAc "
            SELECT NOT EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p','S','v','m') AND pg_get_userbyid(c.relowner) <> 'scheduler_migrator'
              UNION ALL
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public' AND p.prokind IN ('f','p') AND pg_get_userbyid(p.proowner) <> 'scheduler_migrator'
            )")
          test "$owner_check" = t
          role_check=$(docker compose exec -T postgres psql -U postgres -d "$dr_database" -tAc "
            SELECT COUNT(*)=9 AND bool_and(
              NOT rolsuper AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls
              AND (rolname='scheduler_restore' OR NOT rolcreatedb)
            )
            FROM pg_roles
            WHERE rolname IN ('scheduler_migrator','scheduler_bot','scheduler_parser','scheduler_privacy','scheduler_admin','scheduler_site','scheduler_public_reader','scheduler_backup','scheduler_restore')")
          test "$role_check" = t
          docker compose exec -T -e PGPASSWORD=ci-site-database-password postgres \
            psql -h 127.0.0.1 -U scheduler_site -d "$dr_database" -v ON_ERROR_STOP=1 \
            -c 'SELECT * FROM public_site_statistics' \
            -c 'SELECT * FROM public_site_universities LIMIT 1' \
            -c 'SELECT * FROM public_site_sources LIMIT 1'
          if docker compose exec -T -e PGPASSWORD=ci-site-database-password postgres \
            psql -h 127.0.0.1 -U scheduler_site -d "$dr_database" -c 'SELECT * FROM users LIMIT 1'; then
            echo "Site role retained access to a private table after restore."
            exit 1
          fi
          docker compose exec -T -e PGPASSWORD=ci-bot-database-password postgres \
            psql -h 127.0.0.1 -U scheduler_bot -d "$dr_database" -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM users'
          docker compose exec -T -e PGPASSWORD=ci-parser-database-password postgres \
            psql -h 127.0.0.1 -U scheduler_parser -d "$dr_database" -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM data_sources'
          docker compose exec -T -e PGPASSWORD=ci-privacy-database-password postgres \
            psql -h 127.0.0.1 -U scheduler_privacy -d "$dr_database" -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM privacy_deletion_requests'
          docker compose exec -T -e PGPASSWORD=ci-admin-database-password postgres \
            psql -h 127.0.0.1 -U scheduler_admin -d "$dr_database" -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM data_sources'
          docker compose exec -T -e PGPASSWORD=ci-backup-database-password postgres \
            psql -h 127.0.0.1 -U scheduler_backup -d "$dr_database" -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM schema_migrations'
          docker compose exec -T -e PGPASSWORD=ci-migrator-password-long postgres \
            psql -h 127.0.0.1 -U scheduler_migrator -d "$dr_database" -v ON_ERROR_STOP=1 \
            -c "CREATE OR REPLACE FUNCTION dr_future_migration_probe() RETURNS integer LANGUAGE sql AS 'SELECT 2'" \
            -c 'CREATE TABLE dr_future_migration_table (id bigint PRIMARY KEY)' \
            -c 'SELECT dr_future_migration_probe()'
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop Compose
        if: always()
        run: docker compose --profile ci down -v --remove-orphans
      - name: Remove temporary backup keys and copies
        if: always()
        shell: bash
        run: sudo rm -rf -- "${RUNNER_TEMP:?}/scheduler-backup-keys" "${RUNNER_TEMP:?}/scheduler-backup-offsite"

  postgres-tls:
    name: Production PostgreSQL TLS
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.tls-ci.yml
      TLS_CERT_DIR: /tmp/scheduler-postgres-tls
      BOT_TOKEN: 123456:ci-only-not-a-real-token
      BOT_TELEGRAM_API_URL: http://telegram-mock:8080
      BOT_TELEGRAM_API_ALLOW_INSECURE: "true"
      DATABASE_NAME: scheduler
      POSTGRES_SUPERUSER: postgres
      POSTGRES_SUPERUSER_PASSWORD: ci-tls-superuser-password-unique
      DATABASE_MIGRATOR_PASSWORD: ci-tls-migrator-password-unique
      DATABASE_BOT_PASSWORD: ci-tls-bot-password-unique-value
      DATABASE_PARSER_PASSWORD: ci-tls-parser-password-unique-value
      DATABASE_PRIVACY_PASSWORD: ci-tls-privacy-password-unique-value
      DATABASE_ADMIN_PASSWORD: ci-tls-admin-password-unique
      DATABASE_SITE_PASSWORD: ci-tls-site-password-unique-value
      DATABASE_BACKUP_PASSWORD: ci-tls-backup-password-unique
      DATABASE_RESTORE_PASSWORD: ci-tls-restore-password-unique
      ADMIN_METRICS_TOKEN: ci-tls-metrics-token-with-at-least-32-characters
      BACKUP_OFFSITE_RETENTION_MODE: filesystem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create a private test CA and PostgreSQL certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TLS_CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=Scheduler CI CA' \
            -keyout "$TLS_CERT_DIR/ca.key" -out "$TLS_CERT_DIR/ca.crt"
          openssl req -newkey rsa:2048 -nodes -subj '/CN=postgres' \
            -keyout "$TLS_CERT_DIR/server.key" -out "$TLS_CERT_DIR/server.csr"
          printf '%s\n' 'subjectAltName=DNS:postgres' 'extendedKeyUsage=serverAuth' > "$TLS_CERT_DIR/server.ext"
          openssl x509 -req -days 1 -sha256 \
            -in "$TLS_CERT_DIR/server.csr" \
            -CA "$TLS_CERT_DIR/ca.crt" -CAkey "$TLS_CERT_DIR/ca.key" -CAcreateserial \
            -extfile "$TLS_CERT_DIR/server.ext" -out "$TLS_CERT_DIR/server.crt"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=Wrong Scheduler CI CA' \
            -keyout "$TLS_CERT_DIR/wrong-ca.key" -out "$TLS_CERT_DIR/wrong-ca.crt"
          chmod 0644 "$TLS_CERT_DIR"/*.crt
          chmod 0600 "$TLS_CERT_DIR"/*.key
      - run: cp .env.example .env
      - name: Start the application through verify-full connections
        run: docker compose --profile ci up -d --build telegram-mock postgres admin site
      - name: Wait for TLS-backed services
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:18081/api/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Start TLS-backed runtime workers
        shell: bash
        run: |
          docker compose exec -T postgres psql -U postgres -d scheduler \
            -c "UPDATE data_sources SET is_enabled=FALSE"
          docker compose --profile ci up -d bot parser-worker privacy-worker
          for attempt in $(seq 1 60); do
            if docker compose exec -T bot wget -q -O - http://127.0.0.1:8082/ready >/dev/null \
              && docker compose exec -T parser-worker wget -q -O - http://127.0.0.1:8083/ready >/dev/null \
              && docker compose exec -T privacy-worker wget -q -O - http://127.0.0.1:8084/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run the production configuration preflight
        shell: bash
        run: |
          set -euo pipefail
          offsite="$RUNNER_TEMP/scheduler-tls-offsite"
          key_dir="$RUNNER_TEMP/scheduler-tls-preflight-key"
          mkdir -p "$offsite" "$key_dir"
          printf '%s\n' scheduler-offsite > "$offsite/.scheduler-offsite"
          backup_uid="$(docker compose run --rm --no-deps --entrypoint id backup -u)"
          backup_gid="$(docker compose run --rm --no-deps --entrypoint id backup -g)"
          sudo chown -R "$backup_uid:$backup_gid" "$offsite" "$key_dir"
          sudo chmod 0700 "$offsite" "$key_dir"
          recipient="$(docker compose run --rm --no-deps --entrypoint /bin/sh \
            -v "$key_dir:/keys" backup -ec \
            'umask 077; age-keygen --output /keys/identity; age-keygen -y /keys/identity' \
            | tail -n 1 | tr -d '\r')"
          case "$recipient" in
            age1*) ;;
            *) echo 'Failed to generate a valid age recipient.' >&2; exit 1 ;;
          esac
          docker compose run --rm --no-deps \
            -v "$TLS_CERT_DIR/ca.crt:/run/certs/ca.crt:ro" \
            -e DEPLOYMENT_ENV=production \
            -e DATABASE_HOST=postgres -e DATABASE_PORT=5432 -e DATABASE_NAME=scheduler \
            -e DATABASE_SSLMODE=verify-full -e PGSSLROOTCERT=/run/certs/ca.crt \
            -e POSTGRES_SUPERUSER=postgres -e POSTGRES_SUPERUSER_PASSWORD \
            -e DATABASE_MIGRATOR_USER=scheduler_migrator -e DATABASE_MIGRATOR_PASSWORD \
            -e DATABASE_BOT_USER=scheduler_bot -e DATABASE_BOT_PASSWORD \
            -e DATABASE_PARSER_USER=scheduler_parser -e DATABASE_PARSER_PASSWORD \
            -e DATABASE_PRIVACY_USER=scheduler_privacy -e DATABASE_PRIVACY_PASSWORD \
            -e DATABASE_ADMIN_USER=scheduler_admin -e DATABASE_ADMIN_PASSWORD \
            -e DATABASE_SITE_USER=scheduler_site -e DATABASE_SITE_PASSWORD \
            -e DATABASE_BACKUP_USER=scheduler_backup -e DATABASE_BACKUP_PASSWORD \
            -e DATABASE_RESTORE_USER=scheduler_restore -e DATABASE_RESTORE_PASSWORD \
            -e ADMIN_COOKIE_SECURE=true -e ADMIN_ACCESS_LOGIN_ENABLED=false \
            -e ADMIN_PUBLIC_URL=https://admin.example.test -e SITE_PUBLIC_URL=https://scheduler.example.test \
            -e ADMIN_METRICS_TOKEN -e BOT_TOKEN=123456:ci-production-preflight-token-long-enough \
            -e BOT_TELEGRAM_API_ALLOW_INSECURE=false \
            --entrypoint /app/scheduler-preflight app-image
          docker compose run --rm --no-deps \
            -v "$offsite:/offsite" \
            -e DEPLOYMENT_ENV=production \
            -e BACKUP_REQUIRE_OFFSITE=true -e BACKUP_OFFSITE_DIRECTORY=/offsite \
            -e BACKUP_OFFSITE_SENTINEL_FILE=/offsite/.scheduler-offsite \
            -e BACKUP_AGE_RECIPIENT="$recipient" \
            -e BACKUP_INTERVAL_SECONDS=86400 -e BACKUP_MAX_AGE_SECONDS=90000 \
            -e BACKUP_RETENTION_DAYS=14 -e BACKUP_RETRY_SECONDS=300 \
            -e BACKUP_OFFSITE_MAX_AGE_SECONDS=90000 \
            -e BACKUP_OFFSITE_RETENTION_MODE=filesystem \
            -e BACKUP_OFFSITE_RETENTION_DAYS=90 -e BACKUP_OFFSITE_MIN_GENERATIONS=7 \
            -e BACKUP_OFFSITE_MAX_BYTES=0 \
            --entrypoint /usr/local/bin/scheduler-backup-preflight backup
      - name: Verify TLS identity and reject plaintext
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres sh -ec \
            'PGPASSWORD="$POSTGRES_PASSWORD" PGSSLMODE=verify-full PGSSLROOTCERT=/tls-source/ca.crt psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT 1"'
          if docker compose exec -T postgres sh -ec \
            'PGPASSWORD="$POSTGRES_PASSWORD" PGSSLMODE=disable psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1"'; then
            echo 'PostgreSQL accepted an unencrypted network connection.'
            exit 1
          fi
          if docker compose exec -T postgres sh -ec \
            'PGPASSWORD="$POSTGRES_PASSWORD" PGSSLMODE=verify-full PGSSLROOTCERT=/tls-source/wrong-ca.crt psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1"'; then
            echo 'PostgreSQL accepted a certificate signed by an unknown CA.'
            exit 1
          fi
          if docker compose exec -T postgres sh -ec \
            'PGPASSWORD="$POSTGRES_PASSWORD" PGSSLMODE=verify-full PGSSLROOTCERT=/tls-source/ca.crt psql -h postgres-wrong-host -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1"'; then
            echo 'PostgreSQL accepted a certificate for the wrong hostname.'
            exit 1
          fi
      - name: Verify backup and restore clients over TLS
        shell: bash
        run: |
          docker compose run --rm --no-deps --entrypoint /bin/sh backup -ec \
            'export PGPASSWORD="$DATABASE_PASSWORD" PGSSLMODE="$DATABASE_SSLMODE" PGSSLROOTCERT; . /usr/local/lib/scheduler-backup-lib.sh; create_local_backup'
          docker compose run --rm --no-deps \
            -e DATABASE_USER=scheduler_restore \
            -e DATABASE_PASSWORD="$DATABASE_RESTORE_PASSWORD" \
            --entrypoint /usr/local/bin/scheduler-verify-backup backup
      - name: TLS diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop TLS Compose
        if: always()
        run: docker compose --profile ci down -v --remove-orphans
      - name: Remove TLS material
        if: always()
        shell: bash
        run: sudo rm -rf -- "$TLS_CERT_DIR" "$RUNNER_TEMP/scheduler-tls-offsite" "$RUNNER_TEMP/scheduler-tls-preflight-key"
