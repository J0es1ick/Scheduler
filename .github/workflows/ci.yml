name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go module metadata
        run: go mod tidy -diff
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/admin/package-lock.json
            web/site/package-lock.json
      - name: Build embedded web assets
        run: |
          npm ci --prefix web/admin
          npm run build --prefix web/admin
          npm ci --prefix web/site
          npm run build --prefix web/site
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test -race ./cmd/... ./connector/... ./integrations/... ./internal/... ./migration/... ./parser/...
      - run: go vet ./cmd/... ./connector/... ./integrations/... ./internal/... ./migration/... ./parser/...
      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./connector/... ./integrations/... ./internal/... ./parser/...

  web:
    name: Web ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, site]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate

  connector-python:
    name: Python Connector SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ./sdk/python
      - run: python -m unittest discover -s sdk/python/tests -v
      - run: python -m compileall -q sdk/python/scheduler_connector

  admin-e2e:
    name: Admin E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose-smoke:
    name: Migrations, Compose and restore smoke
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: 123456:ci-only-not-a-real-token
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-database-password
      DATABASE_NAME: scheduler
      ADMIN_METRICS_TOKEN: ci-metrics-token
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build postgres admin site bot
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:18081/api/ready >/dev/null \
              && docker compose exec -T bot wget -q -O - http://127.0.0.1:8082/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Verify every embedded migration was applied
        run: |
          expected=$(find migration -name '*.up.sql' | wc -l | tr -d ' ')
          actual=$(docker compose exec -T postgres psql -U postgres -d scheduler -tAc 'SELECT COUNT(*) FROM schema_migrations')
          test "$actual" = "$expected"
      - name: Build embedded admin assets
        run: |
          npm ci --prefix web/admin
          npm run build --prefix web/admin
      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-database-password@127.0.0.1:55432/scheduler?sslmode=disable
        run: go test -tags=integration ./internal/database ./internal/repository ./internal/admin ./internal/connectorapi -count=1
      - name: Create and restore-verify a backup
        run: |
          docker compose up -d --build backup
          for attempt in $(seq 1 30); do
            if docker compose exec -T backup /usr/local/bin/scheduler-backup-health; then
              docker compose exec -T backup /usr/local/bin/scheduler-verify-backup
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop Compose
        if: always()
        run: docker compose down -v --remove-orphans
